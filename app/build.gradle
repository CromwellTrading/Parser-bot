
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 34
    namespace "com.synthesisone.app"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.synthesisone.app"
        minSdk 26
        targetSdk 34
        // Cada ejecución de GitHub genera un versionCode creciente para permitir
        // actualizar la APK sin desinstalar la versión anterior.
        def runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 0
        versionCode (runNumber > 0 ? 1000 + runNumber : 1000)
        versionName "1.6." + (runNumber > 0 ? runNumber : "0")
    }
    // La firma de release se inyecta desde GitHub Secrets o variables de entorno.
    // Nunca se incluye el keystore privado dentro del repositorio.
    def releaseKeystorePath = System.getenv("SYNTHESISONE_KEYSTORE_PATH") ?: "synthesisone-release.jks"
    def releaseStorePassword = System.getenv("SYNTHESISONE_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("SYNTHESISONE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("SYNTHESISONE_KEY_PASSWORD")
    def releaseKeystoreFile = rootProject.file(releaseKeystorePath)
    def releaseSigningReady = releaseKeystoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    if (releaseTaskRequested && !releaseSigningReady) {
        throw new GradleException(
            "Release signing no configurado. Define SYNTHESISONE_KEYSTORE_PATH (opcional), " +
            "SYNTHESISONE_STORE_PASSWORD, SYNTHESISONE_KEY_ALIAS y SYNTHESISONE_KEY_PASSWORD, " +
            "y proporciona el keystore de release."
        )
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
